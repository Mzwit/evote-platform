# Encrypted, off-site backups with point-in-time recovery. The S3 bucket must
# have Object Lock (WORM) enabled so backups cannot be deleted or altered.
[global]
repo1-type=s3
repo1-s3-bucket=evote-backups
repo1-s3-endpoint=s3.example.org
repo1-s3-region=af-south-1
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${PGBACKREST_CIPHER_PASS}
repo1-retention-full=8
start-fast=y
compress-type=zst

[evote]
pg1-path=/var/lib/postgresql/16/main
