# Edge: TLS 1.3 only, HTTP->HTTPS, per-IP connection limits, path routing so that
# anonymous ballots go to the cast service and nothing else.
global
  maxconn 200000
  ssl-default-bind-options ssl-min-ver TLSv1.3
  log stdout format raw local0 info

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  option http-server-close
  # Privacy: no client IPs in logs for /api/cast (see frontend rule below).
  log-format "%ci %ST %Tr %HM %HP"

frontend https
  bind :443 ssl crt /certs/site.pem alpn h2,http/1.1
  bind :80
  http-request redirect scheme https code 301 unless { ssl_fc }
  stick-table type ip size 1m expire 60s store http_req_rate(10s),conn_cur
  http-request track-sc0 src
  http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }
  http-request set-log-level silent if { path_beg /api/cast }
  use_backend cast if { path_beg /api/cast }
  default_backend api

backend api
  balance leastconn
  option httpchk GET /readyz
  server-template api 4 api:8080 check resolvers docker init-addr none

backend cast
  balance leastconn
  option httpchk GET /readyz
  server-template cast 4 cast:8080 check resolvers docker init-addr none

resolvers docker
  nameserver dns 127.0.0.11:53
